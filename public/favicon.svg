<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer border / Bottom white half -->
  <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  
  <!-- Top Half (Vue Green) -->
  <path d="M 5 50 A 45 45 0 0 1 95 50 Z" fill="#42b883"/>
  
  <!-- Middle Black Band -->
  <rect x="5" y="44" width="90" height="12" fill="#111111"/>
  
  <!-- Outer Center Button -->
  <circle cx="50" cy="50" r="16" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  
  <!-- Inner Center Button -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  
  <!-- Glossy Shine Effect sa taas ng Pokeball -->
  <path d="M 20 30 A 25 25 0 0 1 40 12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
